# Krakit local stack
# Usage:
#   docker compose up -d                  # infra only-friendly: start everything defined
#   docker compose up -d --build          # rebuild and start services
#   make infra                            # infra dependencies only
#
# See CONTRIBUTING.md for full setup.

include:
  - path: infra/docker-compose.infra.yml
  - path: services/docker-compose.services.yml

